# A pushed `v*` tag (cut from main after a merge) publishes a GitHub Release
# with breader.exe for x64 and ARM64 and the signed Android APK. The tag must
# match the version in src-tauri/Cargo.toml. A manual run ("Run workflow")
# only uploads the files as artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # One x64 runner builds both: MSVC cross-compiles to ARM64.
    runs-on: windows-latest
    env:
      # Baked into google::CLIENT_ID/CLIENT_SECRET, as in windows.yml.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) {
            throw "The GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET secrets are missing: a release would ship without Google Drive"
          }
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match the version in src-tauri/Cargo.toml (v$version)"
          }

      - uses: ./.github/actions/setup
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - run: npm test
      - run: npm run build:x64
      - run: npm run build:arm64

      - name: Collect the exes
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/breader.exe release/breader-x64.exe
          Copy-Item src-tauri/target/aarch64-pc-windows-msvc/release/breader.exe release/breader-arm64.exe

      # Only a pushed tag publishes; a manual run never does, even from a tag.
      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create $env:TAG
          release/breader-x64.exe release/breader-arm64.exe
          --title "Book Reader $env:TAG"
          --generate-notes

      - name: Keep the exes (manual runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: book-reader-windows
          path: release/

  # The Android app, signed with the release key, added to the same release.
  android:
    needs: windows
    runs-on: ubuntu-latest
    env:
      # Baked into google::CLIENT_ID, as in android.yml (the Android client has no secret).
      GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          targets: aarch64-linux-android
          java: 'true'

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$GOOGLE_ANDROID_CLIENT_ID" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::The GOOGLE_ANDROID_CLIENT_ID secret is missing: a release would ship without Google Drive"
            exit 1
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The ANDROID_KEYSTORE secret is missing"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: npx tauri android build --apk --target aarch64 --ci
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # Only the signed APK: an `-unsigned` one means signing failed.
      - name: Collect the APK
        run: |
          mkdir -p release
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)"
          if [ -z "$apk" ]; then echo "::error::No signed release APK was built"; exit 1; fi
          cp "$apk" release/book-reader-android.apk

      - name: Add it to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release/book-reader-android.apk --clobber

      - name: Keep the APK (manual runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: book-reader-apk
          path: release/
