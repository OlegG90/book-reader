# Builds the Android app into an APK for the phone (arm64 only). The Android
# SDK and NDK have no Windows-on-ARM64 builds, so the APK is made here, never
# on the PC, and installed with `adb install`. The Gradle project in
# src-tauri/gen/android was made by `tauri android init` and is kept in the
# repo, changed by hand from there (SystemPlugin.kt, the manifest, signing).
name: Android

# Every push that touches the app or what it is built from, on any branch.
on:
  push:
    paths: ['src/**', 'src-tauri/**', 'index.html', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.ts', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # The runner has the SDK and an NDK.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      # A release build, signed with the personal release key (repository
      # secrets), so each new APK installs over the previous one. An APK signed
      # with any other key wouldn't install over it, so without the secrets the
      # build fails.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The ANDROID_KEYSTORE secret is missing"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: npx tauri android build --apk --target aarch64 --ci
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: book-reader-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
