[package]
name = "book-reader"
version = "0.1.0"
description = "A compact e-book reader with a local library"
authors = ["OlegG90"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "breader_lib"

[[bin]]
name = "breader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
toml = "0.9"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-dialog = "2.7.3"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
