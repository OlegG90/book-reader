[package]
name = "book-reader"
version = "0.8.0"
description = "A compact e-book reader with a local library"
authors = ["OlegG90"]
license = "MIT"
repository = "https://github.com/OlegG90/book-reader"
edition = "2021"
rust-version = "1.85"

[lib]
name = "breader_lib"
# staticlib and cdylib for Android, rlib for the Windows exe and the tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "breader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
toml = "0.9"

[dependencies]
rand = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41.0"
encoding_rs = "0.8.35"
base64 = "0.23.1"
url = "2.5.9"
md-5 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# Windows only: file associations and the console for --help / --version.
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_Shell"] }

# Desktop only: a second launch hands its file to the running app.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.5"
# File dialogs (books, the library folder); a phone uses SystemPlugin.kt.
tauri-plugin-dialog = "2.7.3"
# Catalog passwords live in the OS credential store (the Windows Credential Manager...).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# A book deleted from the library goes to the Recycle Bin.
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
