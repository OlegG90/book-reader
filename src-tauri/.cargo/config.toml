# The TLS library (ring, under rustls) compiles C with clang when building for
# Windows on ARM64. LLVM's installer doesn't put clang on PATH, so point at its
# default location (`winget install LLVM.LLVM`). Other targets don't need it:
# x64 Windows uses MSVC, Android uses the NDK's clang in CI.
[env]
CC_aarch64_pc_windows_msvc = "C:/Program Files/LLVM/bin/clang.exe"
AR_aarch64_pc_windows_msvc = "C:/Program Files/LLVM/bin/llvm-ar.exe"
